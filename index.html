<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>광물 채집 플랫폼 — 탐석 · 금빛 여울</title>
<style>
:root{--ink:#f2ece2;--mut:#a59c8e;--gold:#f2c14e;--line:rgba(255,255,255,.1)}
*{box-sizing:border-box;margin:0}html,body{height:100%;background:#0c0b0a;color:var(--ink);font-family:"Pretendard","Noto Sans KR",system-ui,sans-serif;overflow:hidden}
#home{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:24px;
 background:radial-gradient(1200px 700px at 20% 10%,rgba(232,160,32,.13),transparent 60%),radial-gradient(1000px 700px at 85% 90%,rgba(60,140,220,.12),transparent 60%),#0c0b0a}
#home h1{font-size:clamp(26px,4vw,42px);letter-spacing:-.5px;font-weight:800;text-align:center}
#home h1 small{display:block;font-size:13px;font-weight:500;color:var(--mut);letter-spacing:4px;margin-bottom:8px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,360px));gap:20px;justify-content:center;width:100%}
.card{position:relative;border:1px solid var(--line);border-radius:22px;padding:26px 24px 22px;background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.015));cursor:pointer;overflow:hidden;transition:transform .2s,border-color .2s;text-align:left;color:inherit;font:inherit}
.card:hover{transform:translateY(-4px);border-color:rgba(242,193,78,.5)}
.card .gem{width:64px;height:64px;margin-bottom:16px}
.card h2{font-size:24px;margin-bottom:6px}.card p{color:var(--mut);font-size:14px;line-height:1.55}
.card .go{margin-top:18px;display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:12px;font-weight:700;font-size:14px}
.card.ts .go{background:#e8a020;color:#241600}.card.gb .go{background:#3a8fd6;color:#fff}
.card .st{position:absolute;right:16px;top:16px;font-size:11.5px;color:var(--mut)}
.card .st b{color:#8fe08a}
.note{max-width:740px;color:var(--mut);font-size:13px;line-height:1.6;text-align:center}
.note b{color:var(--ink)}
.inbox{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;font-size:12.5px;color:var(--mut)}
.inbox span{padding:4px 10px;border:1px solid var(--line);border-radius:20px}
iframe.game{position:fixed;inset:0;width:100%;height:100%;border:0;display:none;background:#0c0b0a}
#homeBtn{position:fixed;left:50%;top:8px;transform:translateX(-50%);z-index:2147483000;display:none;padding:6px 14px;border-radius:20px;border:1px solid rgba(255,255,255,.18);background:rgba(10,10,10,.6);backdrop-filter:blur(8px);color:var(--ink);font:600 12.5px "Noto Sans KR",sans-serif;cursor:pointer;opacity:.75}
#homeBtn:hover{opacity:1}
</style></head><body>
<div id="home">
 <h1><small>MINERAL COLLECTOR PLATFORM</small>광물 채집 플랫폼</h1>
 <div class="cards">
  <button class="card ts" data-game="ts"><span class="st" id="stTs">대기</span>
   <svg class="gem" viewBox="0 0 64 64"><defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd27a"/><stop offset="1" stop-color="#b8601a"/></linearGradient></defs><path d="M32 4 50 18 46 50 32 60 18 50 14 18Z" fill="url(#g1)"/><path d="M32 4 32 60M14 18 50 18M18 50 46 50" stroke="#fff6" stroke-width="1.5" fill="none"/></svg>
   <h2>탐석</h2><p>지질 표본 채집 시뮬레이터. 산지를 탐사해 바위를 깨고, 표본을 손질·감정해 박물관을 꾸며요.</p><span class="go">접속하기 →</span></button>
  <button class="card gb" data-game="gb"><span class="st" id="stGb">대기</span>
   <svg class="gem" viewBox="0 0 64 64"><defs><linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9fe0ff"/><stop offset="1" stop-color="#2a6ab0"/></linearGradient></defs><path d="M10 40c8-6 14-6 22 0s14 6 22 0v14H10Z" fill="#2a6ab088"/><path d="M24 8 40 8 46 22 32 40 18 22Z" fill="url(#g2)"/><circle cx="48" cy="44" r="3" fill="#f2c14e"/><circle cx="20" cy="47" r="2" fill="#f2c14e"/></svg>
   <h2>금빛 여울</h2><p>3D 강가 사금·광물 채집. 패닝과 자갈 선별, 세공과 사포 연마, 경매로 나만의 수집을 완성해요.</p><span class="go">접속하기 →</span></button>
 </div>
 <div class="inbox" id="inbox"></div>
 <p class="note">두 게임은 <b>표본을 서로 옮길 수 있어요.</b> 금빛 여울 배낭에서 <b>⇄ 탐석으로 보내기</b>, 탐석 실험실에서 <b>⇄ 금빛 여울로 보내기</b>(모암 없는 단일 광물만)를 누르면 돼요. 옮겨진 표본은 모양 그대로, 가격은 받는 게임 기준으로 다시 매겨지고, 원래 게임으로 돌려보내면 원래 가격으로 돌아가요.<br>고르지 않은 게임은 불러오지 않고, 한 번 연 게임도 다른 게임을 하는 동안 그래픽이 멈춰요 (멀티플레이 연결만 유지).</p>
</div>
<button id="homeBtn">⌂ 메인 화면</button>
<script>
(function(){
const SRC={ts:'tamseok.html',gb:'geumbit.html'};
const frames={};let cur=null;
const $=id=>document.getElementById(id);
function post(id,msg){const f=frames[id];if(f&&f.contentWindow)try{f.contentWindow.postMessage({plat:msg},'*')}catch(e){}}
function status(){for(const id of['ts','gb']){const el=$(id==='ts'?'stTs':'stGb');if(el)el.innerHTML=frames[id]?(cur===id?'<b>실행 중</b>':'일시정지됨'):'불러오지 않음'}
 const n=k=>{try{return JSON.parse(localStorage.getItem(k)||'[]').length}catch(e){return 0}},a=n('plat_inbox_ts'),b=n('plat_inbox_gb');
 $('inbox').innerHTML=(a?`<span>탐석으로 가는 중인 표본 ${a}개</span>`:'')+(b?`<span>금빛 여울로 가는 중인 표본 ${b}개</span>`:'')}
/* 같은 출처의 게임 파일을 iframe으로 — 고르지 않은 게임은 그래픽 동결, 멀티플레이만 유지 */
function openGame(id){for(const k in frames)if(k!==id){frames[k].style.display='none';post(k,'freeze')}
 if(!frames[id]){const f=document.createElement('iframe');f.className='game';f.setAttribute('allow','autoplay; fullscreen; clipboard-write; pointer-lock');f.src=SRC[id];document.body.appendChild(f);frames[id]=f}
 frames[id].style.display='block';post(id,'thaw');cur=id;$('home').style.display='none';$('homeBtn').style.display='block';try{frames[id].focus()}catch(e){}status()}
function home(){for(const k in frames){frames[k].style.display='none';post(k,'freeze')}cur=null;$('home').style.display='flex';$('homeBtn').style.display='none';status()}
document.querySelectorAll('[data-game]').forEach(b=>b.addEventListener('click',()=>openGame(b.dataset.game)));
$('homeBtn').addEventListener('click',home);
setInterval(()=>{if(!cur)status()},2000);status();
})();
</script>
</body></html>
