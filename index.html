 </div>

 <p class="note">두 게임은 <b>표본을 서로 옮길 수 있어요.</b> 금빛 여울 배낭에서 <b>⇄ 탐석으로 보내기</b>, 탐석 실험실에서 <b>⇄ 금빛 여울로 보내기</b>를 누르면 돼요 (모암이 붙은 표본도 그대로 옮겨져요). 옮겨진 표본은 모양 그대로, 가격은 받는 게임 기준으로 다시 매겨지고, 원래 게임으로 돌려보내면 원래 가격으로 돌아가요. 옮겨 온 표본도 받은 게임에서 세공할 수 있어요.<br>고르지 않은 게임은 불러오지 않고, 한 번 연 게임도 다른 게임을 하는 동안 그래픽이 멈춰요 (멀티플레이 연결만 유지).</p>

,near(x,y,z,rr){const cx=Math.floor(x/cell),cy=Math.floor(y/cell),cz=Math.floor(z/cell);for(let i=-1;i\u003c=1;i++)for(let j=-1;j\u003c=1;j++)for(let k=-1;k\u003c=1;k++){const a=grid.get((cx+i)+','+(cy+j)+','+(cz+k));if(!a)continue;\n      for(let q=0;q\u003ca.length;q+=3){const dx=a[q]-x,dy=a[q+1]-y,dz=a[q+2]-z;if(dx*dx+dy*dy+dz*dz\u003crr*rr)return true;}}return false;}};}\nfunction scOp(mesh,op,prot,tris){\n  const pa=mesh.geometry.attributes.position,P=pa.array,[,t,px,py,pz,nx,ny,nz,r,d]=op,r2=r*r;let moved=0;\n  if(t===2){let cx=0,cy=0,cz=0,c=0;for(let i=0;i\u003cP.length;i+=3){const dx=P[i]-px,dy=P[i+1]-py,dz=P[i+2]-pz;if(dx*dx+dy*dy+dz*dz\u003cr2){cx+=P[i];cy+=P[i+1];cz+=P[i+2];c++;}}\n    if(!c)return 0;cx/=c;cy/=c;cz/=c;\n    for(let i=0;i\u003cP.length;i+=3){const dx=P[i]-px,dy=P[i+1]-py,dz=P[i+2]-pz,d2=dx*dx+dy*dy+dz*dz;if(d2>=r2)continue;const w=1-Math.sqrt(d2)/r;\n      const h=(P[i]-cx)*nx+(P[i+1]-cy)*ny+(P[i+2]-cz)*nz;if(h\u003c=0)continue;const mv=h*.55*w*w;   // 튀어나온 곳만 눌러 평평하게\n      if(prot&&prot.near(P[i],P[i+1],P[i+2],.05))continue;P[i]-=nx*mv;P[i+1]-=ny*mv;P[i+2]-=nz*mv;tris.add((i/9)|0);moved++;}\n    return moved;}\n  for(let i=0;i\u003cP.length;i+=3){const dx=P[i]-px,dy=P[i+1]-py,dz=P[i+2]-pz,d2=dx*dx+dy*dy+dz*dz;if(d2>=r2)continue;\n    const dist=Math.sqrt(d2),u=dist/r;let k=dx*nx+dy*ny+dz*nz+d*(t===1?1-.7*u*u:1);   // 망치는 가운데가 더 깊게 파이는 조개껍질 모양\n    if(k\u003c=0)continue;const w=u\u003c.62?1:Math.max(0,1-(u-.62)/.38);if(w\u003c=0)continue;\n    if(prot&&prot.near(P[i],P[i+1],P[i+2],.06))continue;\n    const mv=k*w;P[i]-=nx*mv;P[i+1]-=ny*mv;P[i+2]-=nz*mv;tris.add((i/9)|0);moved++;}\n  return moved;}\nfunction scNormals(mesh,tris){const g=mesh.geometry,P=g.attributes.position.array,N=g.attributes.normal.array,a=V3(),b=V3(),c=V3();\n  for(const t of tris){const i=t*9;a.set(P[i],P[i+1],P[i+2]);b.set(P[i+3],P[i+4],P[i+5]);c.set(P[i+6],P[i+7],P[i+8]);b.sub(a);c.sub(a);a.crossVectors(b,c).normalize();\n    for(let k=0;k\u003c3;k++){N[i+k*3]=a.x;N '#sculptBar').innerHTML=SC_TOOLS.map((t,i)=>`\u003cbutton class=\"btn ${SC.tool===i?'primary':''}\" data-sc=\"tool\" data-i=\"${i}\">${t.k}\u003c/button>`).join('')+\n   `\u003cspan class=\"sp\">\u003c/span>\u003cbutton class=\"btn\" data-sc=\"undo\" ${n?'':'disabled'}>↶ 되돌리기\u003c/button>\u003cbutton class=\"btn primary\" data-sc=\"done\">완료\u003c/button>`;}\nfunction scHit(e){const r=canvas.getBoundingClientRect();SC.ndc.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);SC.ray.setFromCamera(SC.ndc,LB.cam);\n  const hs=SC.ray.intersectObjects(partsOf(LB.obj),false);return hs[0]||null;}\nfunction scApplyAt(h){\n  const s=LB.spec,m=h.object,all=partsOf(LB.obj),isMx=m.userData.part==='matrix',list=all.filter(o=>(o.userData.part==='matrix')===isMx),mi=isMx?list.indexOf(m):-(list.indexOf(m)+1);\n  scToNonIndexed(m);const inv=m.matrixWorld.clone().invert(),p=h.point.clone().applyMatrix4(inv),n=h.face.normal.clone().normalize();\n  if(!m.geometry.boundingSphere)m.geometry.computeBoundingSphere();const R=m.geometry.boundingSphere.radius,T=SC_TOOLS[SC.tool];\n  if(SC.stroke.last&&SC.stroke.last.distanceTo(p)\u003cT.r*R*(SC.tool===2?.25:.42))return;SC.stroke.last=p.clone();\n  if(T.jit){n.x+=(Math.random()-.5)*T.jit;n.y+=(Math.random()-.5)*T.jit;n.z+=(Math.random()-.5)*T.jit;n.normalize();}\n  const cm=isMx?1:1.6,rr=T.r*R*(.85+Math.random()*.3)*cm,dd=(T.d||.03)*R*(.8+Math.random()*.4)*(isMx?1:1.8),q=x=>Math.round(x*1e4)/1e4;\n  const op=[mi,SC.tool,q(p.x),q(p.y),q(p.z),q(n.x),q(n.y),q(n.z),q(rr),q(dd),SC.stroke.id];\n  if(isMx&&!SC.stroke.prot)SC.stroke.prot=scProtect(m,all.filter(o=>o.userData.part!=='matrix'));\n  const tris=new Set();if(scOp(m,op,isMx?SC.stroke.prot:null,tris)){\n    if(!isMx){s.loss=1-(1-(s.loss||0))*.985;const now=performance.now();if(now-SC.lastHitT>1200){SC.lastHitT=now;toast(`결정이 깨져 나갔어요! 결정 손실 ${Math.round(s.loss*100)}%`,1600);}}scNormals(m,tris);s.sc=s.sc||[];if(s.sc.length\u003c900)s.sc.push(op);\n    const now=performance.now();if(now-SC.lastSfx>110){SC.lastSfx=now;SFX.hit();}\n    const wp=h.point.clone();if(LB.scene&&Math.random()\u003c.6)scChip(wp,h.face.normal.clone().transformDirection(m.matrixWorld));}}\nconst SC_CHIPS=[];\nfunction scChip(p,n){SC.chipMat=SC.chipMat||new THREE.MeshStandardMaterial({color:'#bdb4a6',roughness:.9});const g=new THREE.Mesh(new THREE.TetrahedronGeometry(.012+Math.random()*.018),SC.chipMat);g.position.copy(p);LB.scene.add(g);\n  SC_CHIPS.push({m:g,v:n.multiplyScalar(.6+Math.random()*.8).add(V3((Math.random()-.5)*.8,.6+Math.random(),(Math.random()-.5)*.8)),t:0});}\nfunction scUpdate(dt){for(let i=SC_CHIPS.length-1;i>=0;i--){const c=SC_CHIPS[i];c.t+=dt;c.v.y-=6*dt;c.m.position.addScaledVector(c.v,dt);c.m.rotation.x+=dt*8;\n  if(c.t>1.1||c.m.position.y\u003c-.05){LB.scene.remove(c.m);c.m.geometry.dispose();SC_CHIPS.splice(i,1);}}}\ncanvas.addEventListener('pointerdown',e=>{if(!SC.on||mode!=='lab')return;if(e.pointerType==='mouse'&&e.button!==0)return;\n  if(SC.stroke){SC.stroke=null;return;} // 두 번째 손가락 → 회전 제스처\n  const h=scHit(e);if(!h)return;SC.stroke={id:(LB.spec.sc&&LB.spec.sc.length?LB.spec.sc[LB.spec.sc.length-1][10]+1:1),pid:e.pointerId,last:null,prot:null};scApplyAt(h);});\ncanvas.addEventListener('pointermove',e=>{if(!SC.on||mode!=='lab')return;const h=scHit(e);\n  if(SC.ring){if(h){const T=SC_TOOLS[SC.tool],m=h.object;if(!m.geometry.boundingSphere)m.geometry.computeBoundingSphere();const ws=new THREE.Vector3();m.getWorldScale(ws);\n      const R=m.geometry.boundingSphere.radius*ws.x*T.r;SC.ring.visible=true;SC.ring.position.copy(h.point);SC.ring.scale.setScalar(R);\n      SC.ring.lookAt(h.point.clone().add(h.face.normal.clone().transformDirection(m.matrixWorld)));SC.ring.material.color.set(m.userData.part==='matrix'?'#ffcf7a':'#ff6a5a');}else SC.ring.visible=false;}\n  if(SC.stroke&&e.pointerId===SC.stroke.pid&&h)scApplyAt(h);});\nconst scUp=e=>{if(SC.stroke&&e.pointerId===SC.stroke.pid){SC.stroke=null;scBar();saveSoon();}};\ncanvas.addEventListener('pointerup',scUp);canvas.addEventListener('pointercancel',scUp);\n$('#sculptBar')&&0;\ndocument.addEventListener('click',e=>{const b=e.target.closest('[data-sc]');if(!b)return;const a=b.dataset.sc,s=LB.spec;SFX.click();\n  if(a==='tool'){SC.tool=+b.dataset.i;scBar();}\n  else if(a==='undo'&&s&&s.sc&&s.sc.length){const g=s.sc[s.sc.length-1][10];s.sc=s.sc.filter(o=>o[10]!==g);const keep=SC.on;setLabSpecimen(s);if(keep){SC.on=true;lControls.autoRotate=false;LB.scene.add(SC.ring);$('#lab').classList.add('sculpting');$('#labSheet').classList.add('collapsed');}scBar();saveSoon();}\n  else if(a==='done')sculptEnd();});\n\n/* ============================ 보석 세공 ============================\n   원석(볼록 다면체)을 평면으로 정확히 잘라(볼록 클리핑) 면을 냅니다. 연마된 면(aCut)은 표면 결함 없이 매끈하게 렌더링됩니다.\n   spec.gem = {f:[[nx,ny,nz,d],...], base:세공 전 감정가, vr:남은 부피비, cm:원석 크기}  — 가치는 오르지 않고 깎인 만큼만 줄어듭니다. */\nconst GEMMABLE=lk=>['glass','deep','resin','opal','silk','pearl','opq'].includes(lk);\nconst GRP_CACHE=new Map();\nfunction gemRoughPtsExt(spec){const key=spec.id+':'+(spec.gbVis&&spec.gbVis.bb.join(','));if(GRP_CACHE.has(key))return GRP_CACHE.get(key).map(p=>p.clone());\n  let best=null,bv=-1;for(const {geo,m} of xVisGeos(THREE,spec.gbVis)){if(m.rk||m.metal>.5){geo.dispose();continue;}geo.computeBoundingBox();const z=geo.boundingBox.getSize(V3()),v=z.x*z.y*z.z;if(v>bv){if(best)best.dispose();best=geo;bv=v;}else geo.dispose();}\n  if(!best)return null;const pa=best.attributes.position,raw=[];for(let i=0;i\u003cpa.count;i++)raw.push(V3(pa.getX(i),pa.getY(i),pa.getZ(i)));best.dispose();\n  // 지지점(극점)만 골라 볼록 껍질 계산을 가볍게\n  const ic=new THREE.IcosahedronGeometry(1,2),ip=ic.attributes.position,seen=new Set(),pts=[];for(let i=0;i\u003cip.count;i++){const n=V3(ip.getX(i),ip.getY(i),ip.getZ(i)).normalize();let bi=0,bd=-1e9;for(let j=0;j\u003craw.length;j++){const d=raw[j].dot(n);if(d>bd){bd=d;bi=j;}}if(!seen.has(bi)){seen.add(bi);pts.push(raw[bi].clone());}}ic.dispose();\n  const box=new THREE.Box3().setFromPoints(p On(m);}catch(err){console.warn('net',err);}};\n  ws.onclose=()=>{const was=NET.ok;NET.ok=false;NET.room=null;netClearGhosts();NET.status='오프라인 (재연결 대기)';if(was)toast('멀티플레이 서버와 연결이 끊겼어요.');\n    clearTimeout(netConnect._t);netConnect._t=setTimeout(netConnect,Math.min(30000,2000*Math.pow(1.6,NET.retry++)));};\n  ws.onerror=()=>{};\n}\nfunction netOn(m){\n  switch(m.t){\n  case 'welcome':{NET.ok=true;NET.id=m.id;NET.status='온라인';\n    let got=0;for(const p of m.payouts||[]){S.money+=p.price;got+=p.price;}if(got){save();updateHUD();toast(`거래소 판매 대금 ${won(got)}이 들어왔어요.`);}\n    for(const s of m.returns||[]){if(specOK(s)){s.id=S.nextId++;S.col.unshift(s);}}if((m.returns||[]).length){save();updateHUD();}\n    if(F.site)netJoin(F.site.seed);netPubMuseum(true);break;}\n  case 'world':{if(m.seed!==NET.room||!F.ready||F.site.seed!==m.seed)break;\n    for(const i of m.broken||[])netRemoteBreak(i,true);\n    for(const [k,who] of Object.entries(m.taken||{}))netTaken(+k,who,true);\n    for(const p of m.peers||[])netPeer(p);break;}\n  case 'peer':netPeer(m.p);break;\n  case 'pos':{const g=NET.peers.get(m.id);if(g){g.tx=m.x;g.tz=m.z;g.th=m.h;g.w=m.w;g.r=m.r;if(m.s&&!g.sw)g.sw=.001;}break;}\n  case 'bye':netDropPeer(m.id);break;\n  case 'brk':if(m.seed===NET.room)netRemoteBreak(m.i,false,m.nick);break;\n  case 'taken':if(m.seed===NET.room)netTaken(m.key,m.nick,false);break;\n  case 'claim_ok':{const R=F.reveals.find(r=>r.spec.netKey===m.key);if(R){R._granted=true;R._claiming=0;collectReveal(R);}break;}\n  case 'claim_no':{const R=F.reveals.find(r=>r.spec.netKey===m.key);if(R){netKillReveal(R);toast(`${esc(m.nick||'다른 탐석가')}님이 먼저 주웠어요.`);}break;}\n  case 'museums':NET.museums=m.list||[];netRender();break;\n  case 'museum':{const specs=(m.specs||[]).filter(specOK);if(!specs.length){toast('전시된 표본이 없는 박물관이에요.');break;}enterMuseum({nick:m.nick||'탐석가',specs});break;}\n  case 'market':NET.market=m.list||[];NET.mine=m.mine||[];netRender();break;\n  case 'listed':{const s=S.col.find(x=>x.id===m.sid);if(s){S.col=S.col.filter(x=>x!==s);S.museum=(S.museum||[]).filter(x=>x!==s.id);save();updateHUD();}\n    toast('거래소에 올렸어요. 팔리면 대금이 자동으로 들어옵니다.');nsend({t:'market_get'});break;}\n  case 'unlisted':{if(specOK(m.spec)){m.spec.id=S.nextId++;m.spec.thumb=null;S.col.unshift(m.spec);save();updateHUD();toast('판매를 취소하고 수집장으로 돌려받았어요.');}nsend({t:'market_get'});break;}\n  case 'bought':{if(specOK(m.spec)){m.spec.id=S.nextId++;m.spec.thumb=null;m.spec.found=Date.now();S.money-=m.price;S.col.unshift(m.spec);save();updateHUD();SFX.coin();toast(`${specTitle(m.spec)}을(를) ${won(m.price)}에 샀어요!`);}nsend({t:'market_get'});break;}\n  case 'buy_no':toast(m.why||'이미 팔린 표본이에요.');nsend({t:'market_get'});break;\n  case 'sold':{S.money+=m.price;save();updateHUD();SFX.coin();toast(`${esc(m.title||'표본')}이(가) ${won(m.price)}에 팔렸어요!`);nsend({t:'market_get'});break;}\n  case 'err':toast(esc(m.msg||'서버 오류'));break;\n  }\n}\nconst esc=t=>String(t).replace(/[&\u003c>\"']/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\n\n/* ---- 같은 지역 함께 탐석 ---- */\nfunction netJoin(seed){if(!NET.ok)return;if(NET.room!==seed){netClearGhosts();}NET.room=seed;nsend({t:'join',seed});}\nfunction netLeave(){if(NET.room!=null)nsend({t:'leave'});NET.room=null;netClearGhosts();}\nfunction netPeer(p){if(!p||p.id===NET.id||!F.ready)return;let g=NET.peers.get(p.id);\n  if(!g){const pl=makePlayer();pl.g.traverse(o=>{if(o.isMesh)o.castShadow=true;});\n    const cv=document.createElement('canvas');cv.width=256;cv.height=64;const c=cv.getContext('2d');c.fillStyle='rgba(20,16,12,.72)';c.beginPath();c.roundRect(4,8,248,48,22);c.fill();\n    c.fillStyle='#ffd88a';c.font='600 28px \"IBM Plex Sans KR\",sans-serif';c.textAlign='center';c.fillText(String(p.nick||'탐석가').slice(0,12),128,42);\n    const tx=new THREE.CanvasTexture(cv);tx.colorSpace=THREE.SRGBColorSpace;const tag=new THREE.Sprite(new THREE.SpriteMaterial({map:tx,depthWrite:false,transparent:true}));tag.scale.set(1.4,.35,1);tag.position.y=2.55;pl.g.add(tag);\n    F.scene.add(pl.g);g={pl,tag,tx:p.x||0,tz:p.z||0,th:p.h||0,w:0,r:0,sw:0,nick:p.nick};pl.pos.set(g.tx,F.H(g.tx,g.tz),g.tz);NET.peers.set(p.id,g);toast(`${esc(p.nick||'탐석가')}님이 같은 지역에 들어왔어요.`);}\n  if(p.x!=null){g.tx=p.x;g.tz=p.z;g.th=p.h;}}\nfunction netDropPeer(id){const g=NET.peers.get(id);if(!g)return;F.scene.remove(g.pl.g);g.pl.g.traverse(o=>{if(o.geometry)o.geometry.dispose();});NET.peers.delete(id);}\nfunction netClearGhosts(){for(const id of [...NET.peers.keys()])netDropPeer(id);}\nfunction netTick(dt){\n  if(!NET.ok||NET.room==null||!F.ready)return;const P=F.player;\n  NET.posT-=dt;if(NET.posT\u003c=0){NET.posT=.12;const st=[P.pos.x.toFixed(2),P.pos.z.toFixed(2),P.heading.toFixed(2),P.wb>.3?1:0,INP.k.shift?1:0,P.swing?1:0].join(',');\n    if(st!==NET.lastPos){NET.lastPos=st;nsend({t:'pos',x:+P.pos.x.toFixed(2),z:+P.pos.z.toFixed(2),h:+P.heading.toFixed(2),w:P.wb>.3?1:0,r:INP.k.shift?1:0,s:P.swing?1:0});}}\n  for(const g of NET.peers.values()){const pl=g.pl,k=Math.min(1,dt*8);const ox=pl.pos.x,oz=pl.pos.z;\n    pl.pos.x+=(g.tx-pl.pos.x)*k;pl.pos.z+=(g.tz-pl.pos.z)*k;pl.pos.y=F.H(pl.pos.x,pl.pos.z);\n    let dh=g.th-pl.heading;dh=Math.atan2(Math.sin(dh),Math.cos(dh));pl.heading+=dh*k;\n    const sp=Math.hypot(pl.pos.x-ox,pl.pos.z-oz)/Math.max(dt,1e-3),walking=g.w||sp>.4;pl.walkT+=dt*(g.r?11:7.5)*(walking?1:0);\n    if(g.sw){g.sw+=dt;if(g.sw>.5)g.sw=0;}\n    pl.g.position.copy(pl.pos);pl.g.rotation.y=pl.heading;animatePlayer(pl,dt,walking,!!g.r,g.sw?Math.min(1,g.sw/.42):null);}\n}\nfunction netRemoteBreak(i,silent,nick){if(!F.ready)return;const r=F.rocks.find(x=>x.i===i);if(!r||r.broken)return;\n  breakRock(r,r.pos.clone().add(V3(0,r.rad*.5,0)),silent?'silent':'remote');\n  if(!silent&&nick)toast(`${esc(nick)}님이 바위를 깼어요.`,1800);}\nfunction netKillReveal(R){const d=dropsOf(),i=d.findIndex(x=>x.spec.id===R.spec.id);if(i>=0)d.splice(i,1);if(F.cardR===R)showCard(null);removeReveal(R);save();}\nfunction netTaken(key,nick,silent){if(!F.ready)return;const r=F.rocks.find(x=>x.i===key);if(r&&!r.broken)netRemoteBreak(key,true);\n  const R=F.reveals.find(x=>x.spec.netKey===key);if(R&&!R._granted){netKillReveal(R);if(!silent)toast(`${esc(nick||'다른 탐석가')}님이 표본을 먼저 주웠어요.`);}}\nfunction netClaim(R){if(R._claiming&&Date.now()-R._claiming\u003c5000)return true;R._claiming=Date.now();nsend({t:'claim',key:R.spec.netKey,seed:NET.room});\n  setTimeout(()=>{if(R._claiming&&!R._granted&&!NET.ok){R._granted=true;collectReveal(R);}},5000);return true;}\n\n/* ---- 박물관 공개 ---- */\nfunction netPubMuseum(now){if(!NET.ok)return;clearTimeout(NET.pubT);NET.pubT=setTimeout(()=>{\n  const specs=(S.museum||[]).map(id=>S.col.find(x=>x.id===id)).filter(Boolean).slice(0,120).map(specWire);nsend({t:'museum_pub',nick:netNick(),specs});},now?200:2500);}\n\n/* ---- 멀티 화면 ---- */\nfunction netRender(){if(!$('#overlay').classList.contains('hidden')&&$('#sheet [data-netview]'))renderOverlay('multi');}\nfunction netHTML(){\n  const url=netURL(),here=[...NET.peers.values()];\n  const pick=NET.listSpec&&S.col.find(x=>x.id===NET.listSpec);\n  const mk=NET.market.filter(l=>l.seller!==NET.id),mine=NET.market.filter(l=>l.seller===NET.id);\n  return `\u003cdiv class=\"sheetBody\" data-netview=\"1\">\n  \u003cdiv class=\"kicker\">연결\u003c/div>\n  \u003cp style=\"margin:0 0 8px\">상태: \u003cb style=\"color:${NET.ok?'#9fd38a':'#e0a84a'}\">${esc(NET.status)}\u003c/b>${NET.ok&&NET.room!=null?` · 시드 \u003cspan class=\"mono\">${NET.room}\u003c/span> 지역에 ${here.length+1}명`:''}\u003c/p>\n  \u003cdiv class=\"seedRow\">\u003cinput id=\"nickIn\" maxlength=\"12\" placeholder=\"닉네임\" value=\"${esc(S.nick||'')}\">\u003cbutton class=\"btn\" data-act=\"netnick\">닉네임 저장\u003c/button>\u003c/div>\n  \u003cdiv class=\"seedRow\" style=\"margin-top:6px\">\u003cinput id=\"srvIn\" placeholder=\"서버 주소 (예: ws://192.168.0.10:8787/ws)\" value=\"${esc(S.server||'')}\">\u003cbutton class=\"btn\" data-act=\"netsrv\">연결\u003c/button>\u003c/div>\n  ${url?'':`\u003cp class=\"muted\" style=\"font-size:12px;margin-top:8px\">Claude 화면 안에서는 보안상 외부 서버 접속이 막혀 있어요. 함께 받은 \u003cb>server.js\u003c/b>를 실행하고, 브라우저로 그 서버 주소(예: http://내PC주소:8787)에 접속하면 멀티플레이가 켜집니다.\u003c/p>`}\n  \u003cp class=\"muted\" style=\"font-size:12px\">같은 시드를 입력한 사람끼리 같은 지역에서 만나요. 같은 바위에서 나온 표본은 먼저 주운 사람이 가져갑니다.\u003c/p>\n  ${NET.ok?`\n  \u003cdiv class=\"kicker\" style=\"margin-top:14px\">다른 탐석가의 박물관\u003c/div>\n  \u003cdiv class=\"btnrow\" style=\"margin-bottom:8px\">\u003cbutton class=\"btn\" data-act=\"netmus\">목록 새로고침\u003c/button>\u003c/div>\n  ${NET.museums.filter(x=>x.id!==NET.id).length?NET.museums.filter(x=>x.id!==NET.id).map(x=>`\u003cdiv class=\"item\">\u003cdiv style=\"flex:1\">\u003cb>${esc(x.nick)}\u003c/b>\u003cbr>\u003cspan class=\"muted small\">전시 ${x.n}점${x.top?` · 대표 표본 ${esc(x.top)}`:''}\u003c/span>\u003c/div>\u003cbutton class=\"btn primary\" data-act=\"netvisit\" data-id=\"${esc(x.id)}\">방문\u003c/button>\u003c/div>`).join(''):'\u003cp class=\"muted small\">아직 공개된 박물관이 없어요. 내 박물관은 전시한 표본이 있으면 자동으로 공개됩니다.\u003c/p>'}\n  \u003cdiv class=\"kicker\" style=\"margin-top:14px\">표본 거래소\u003c/div>\n  ${pick?`\u003cdiv class=\"item\" style=\"flex-wrap:wrap\">\u003cdiv style=\"flex:1;min-width:160px\">\u003cb>판매 등록: ${esc(specTitle(pick))}\u003c/b>\u003cbr>\u003cspan class=\"muted small\">${specNo(pick)} · ${pick.sizeCm} cm · 등급 ${pick.grade} · 감정가 ${won(specValue(pick))}\u003c/span>\u003c/div>\n     \u003cdiv class=\"seedRow\" style=\"width:100%;margin-top:6px\">\u003cinput id=\"priceIn\" inputmode=\"numeric\" value=\"${Math.round(specValue(pick)/1000)*1000}\">\u003cbutton class=\"btn primary\" data-act=\"netlist\">이 가격에 올리기\u003c/button>\u003cbutton class=\"btn\" data-act=\"netlistx\">취소\u003c/button>\u003c/div>\u003c/div>`:'\u003cp class=\"muted small\">팔고 싶은 표본은 감정실 관찰 탭의 [거래소에 올리기]로 등록하세요.\u003c/p>'}\n  \u003cdiv class=\"btnrow\" style=\"margin:8px 0\">\u003cbutton class=\"btn\" data-act=\"netmkt\">거래소 새로고침\u003c/button>\u003c/div>\n  ${mk.length?mk.slice(0,60).map(l=>`\u003cdiv class=\"item\">\u003cdiv style=\"flex:1\">\u003cb>${esc(specTitle(l.spec))}\u003c/b>\u003cbr>\u003cspan class=\"muted small\">${l.spec.sizeCm} cm · 등급 ${l.spec.grade} · 감정가 ${won(specValue(l.spec))} · 판매자 ${esc(l.nick)}\u003c/span>\u003c/div>\u003cbutton class=\"btn ${S.money>=l.price?'primary':''}\" data-act=\"netbuy\" data-lid=\"${esc(l.lid)}\" ${S.money>=l.price?'':'disabled'}>${won(l.price)}\u003c/button>\u003c/div>`).join(''):'\u003cp class=\"muted small\">올라온 표본이 없어요.\u003c/p>'}\n  ${mine.length?`\u003cdiv class=\"kicker\" style=\"margin-top:10px\">내 판매 목록\u003c/div>`+mine.map(l=>`\u003cdiv class=\"item\">\u003cdiv style=\"flex:1\">\u003cb>${esc(specTitle(l.spec))}\u003c/b>\u003cbr>\u003cspan class=\"muted small\">${won(l.price)}에 판매 중\u003c/span>\u003c/div>\u003cbutton class=\"btn\" data-act=\"netunlist\" data-lid=\"${esc(l.lid)}\">내리기\u003c/button>\u003c/div>`).join(''):''}`:''}\n  \u003c/div>`;}\nfunction netAct(a,b){\n  if(a==='netnick'){S.nick=$('#nickIn').value.trim().slice(0,12);save();if(NET.ok){nsend({t:'nick',nick:netNick()});netPubMuseum(true);}toast('닉네임을 저장했어요.');renderOverlay('multi');return true;}\n  if(a==='netsrv'){S.server=$('#srvIn').value.trim();save();if(NET.ws){NET.ws.onclose=null;try{NET.ws.close();}catch(e){}NET.ws=null;NET.ok=false;}netConnect();setTimeout(()=>renderOverlay('multi'),1500);return true;}\n  if(a==='netmus'){nsend({t:'museums_get'});return true;}\n  if(a==='netmkt'){nsend({t:'market_get'});return true;}\n  if(a==='netvisit'){nsend({t:'museum_get',id:b.dataset.id});return true;}\n  if(a==='netbuy'){const l=NET.market.find(x=>x.lid===b.dataset.lid);if(!l)return true;if(S.money\u003cl.price){toast('자금이 부족해요.');return true;}nsend({t:'buy',lid:l.lid});return true;}\n  if(a==='netunlist'){nsend({t:'unlist',lid:b.dataset.lid});return true;}\n  if(a==='netlistx'){NET.listSpec=null;renderOverlay('multi');return true;}\n  if(a==='netlist'){const s=S.col.find(x=>x.id===NET.listSpec);const p=Math.round((parseInt(String($('#priceIn').value).replace(/\\D/g,''),10)||0)/1000)*1000;\n    if(!s){NET.listSpec=null;renderOverlay('multi');return true;}if(p\u003c1000){toast('가격은 1,000원 이상으로 정해 주세요.');return true;}\n    nsend({t:'list',spec:specWire(s),sid:s.id,price:p,title:specTitle(s)});NET.listSpec=null;renderOverlay('multi');return true;}\n  return false;}\n/* ============================ 셰이더 예열 ============================\n   광물 재질은 종류(투과·광택·쉰·무지개빛·분산·양면)에 따라 서로 다른 셰이더 프로그램이 됩니다.\n   처음 보는 조합이 나올 때마다 브라우저가 셰이더를 새로 컴파일하느라 화면이 멈추므로,\n   가능한 조합을 미리 백그라운드(병렬 컴파일)로 준비해 둡니다. */\nconst WARM={done:new Set()};\nfunction warmGroup(){\n  const g=new THREE.Group(),geo=prep(new THREE.BoxGeometry(.02,.02,.02)),seen=new Set(),mats=[];\n  const add=m=>{const mesh=new THREE.Mesh(geo,m);mesh.castShadow=mesh.receiveShadow=true;mesh.frustumCulled=false;mesh.position.set(0,-500,0);g.add(mesh);mats.push(m);};\n  for(const k of MKEYS){const mn=M[k];if(mn.lk==='rock')continue;for(const v of mn.v){const m=mineralMat(mn,v,null);\n    const key=[m.transmission>0,m.sheen>0,m.clearcoat>0,m.iridescence>0,m.dispersion>0,m.side,m.metalness>.5].join();if(seen.has(key)){m.dispose();continue;}seen.add(key);add(m);}}\n  for(const t of Object.keys(INCL_MAT))add(INCL_MAT[t]());add(gemMat(M.quartz,M.quartz.v[0],null));\n  for(const r of ['granite','basalt','marble','rind'])if(ROCK[r])add(rockMaterial(ROCK[r],{scale:3}));\n  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:TEX.ring,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending}));sp.position.set(0,-500,0);g.add(sp);mats.push(sp.material);\n  add(new THREE.MeshBasicMaterial({color:'#ffcf70',transparent:true,opacity:.18,depthWrite:false,blending:THREE.AdditiveBlending,side:THREE.DoubleSide}));\n  g.userData.mats=mats;g.userData.geo=geo;return g;}\nasync function warmScene(scene,cam,tag){\n  if(WARM.done.has(tag)||!renderer.compileAsync)return;WARM.done.add(tag);\n  const g=warmGroup();scene.add(g);\n  try{await Promise.race([renderer.compileAsync(scene,cam),new Promise(r=>setTimeout(r,30000))]);}catch(e){}\n  scene.remove(g);setTimeout(()=>{for(const m of g.userData.mats)m.dispose();g.userData.geo.dispose();},5000);}\n/* 필드 진입 후 쉬는 틈에 감정실·박물관도 미리 준비 */\nfunction warmLater(){/* 병렬 셰이더 컴파일을 지원할 때만, 한가한 틈에 미리 준비 (미지원 기기에선 플레이 중 멈춤의 원인이라 생략) */\n  if(!renderer.extensions.has('KHR_parallel_shader_compile'))return;const idle=f=>(window.requestIdleCallback?requestIdleCallback(f,{timeout:8000}):setTimeout(f,4000));\n  setTimeout(()=>idle(async()=>{try{applyLight();await warmScene(LB.scene,LB.cam,'lab');idle(async()=>{try{muInit();await warmScene(MU.scene,MU.cam,'museum');}catch(e){}});}catch(e){}}),4000);}\n\n/* ============================ UI ============================ */\nlet mode='field';\nfunction toast(t,ms=2600){const el=$('#toast');el.innerHTML=t;el.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('show'),ms);}\nfunction updateHUD(){$('#money').textContent=won(S.money);$('#colCount').textContent=S.col.length;\n  if(F.site){$('#siteName').textContent=F.site.name;$('#siteSet').textContent=SET[F.site.set].ko+' · '+CLIM[F.site.clim].ko+' · '+WEATHER[F.site.weather].ko;}\n  $('#sndWave').style.opacity=S.sound?1:.15;}\nfunction openOverlay(view){$('#overlay').classList.remove('hidden');renderOverlay(view);}\nfunction closeOverlay(){$('#overlay').classList.add('hidden');}\nlet siteChoices=null;\nconst siteSwatch=s=>SET[s.set].strata.map(k=>`\u003cdiv style=\"height:25%;background:linear-gradient(90deg,${ROCK[k].c1},${ROCK[k].c2})\">\u003c/div>`).join('');\nfunction renderOverlay(view){\n  const sh=$('#sheet'),canClose=!!F.ready;\n  const head=(t,tabs)=>`\u003cdiv class=\"sheetHead\">\u003ch2>${t}\u003c/h2>${canClose?'\u003cbutton class=\"x\" data-act=\"close\">×\u003c/button>':''}\u003c/div>${tabs||''}`;\n  const tabs=v=>`\u003cdiv class=\"tabsRow\">${[['collection','수집장'],['req','의뢰'],['shop','상점'],['multi','멀티'],['map','지도'],['settings','설정']].map(([k,n])=>`\u003cbutton data-act=\"${k}\" class=\"${v===k?'on':''}\">${n}\u003c/button>`).join('')}\u003c/div>`;\n  if(view==='map'){\n    if(!siteChoices){const b=(Date.now()%2147483647)>>>0;siteChoices=[0,1,2].map(i=>genSite(((b+i*7919)*2654435761>>>0)%2147483647||1));}\n    const intro=!F.ready?`\u003cdiv class=\"intro\">\u003cdiv class=\"kicker\">Procedural Geology Simulator\u003c/div>\u003ch1>탐석\u003c/h1>\u003cp>절차적으로 생성된 지질 현장을 누비며 바위를 깨고, ${MKEYS.length}종의 광물 표본을 채집하세요. 감정실에서 경도·조흔·비중·형광·방사능 테스트로 정체를 밝혀내면 가치가 올라갑니다.\u003c/p>\u003cp class=\"muted\" style=\"font-size:12px\">${coarse?'조이스틱·탭으로 이동 · 망치 버튼/바위 탭으로 채굴':'WASD·클릭으로 이동 · Space/바위 클릭으로 채굴 · 우클릭 드래그로 시점 회전 · 휠 확대'}\u003c/p>\u003c/div>`:'';\n    sh.innerHTML=head(F.ready?'탐사 지역':'',F.ready?tabs('map'):'')+`\u003cdiv class=\"sheetBody\">${intro}\u003cdiv class=\"kicker\">이번 시즌 탐사 후보지\u003c/div>\n      ${siteChoices.map((s,i)=>`\u003cdiv class=\"site\">\u003cdiv class=\"swatch\">${siteSwatch(s)}\u003c/div>\u003ch3>${s.name}\u003c/h3>\n        \u003cdiv class=\"meta\">\u003cb>${SET[s.set].ko}\u003c/b> · ${SET[s.set2].ko} 일부${s.river.on&&s.clim!=='arid'?' · 하천':''}\u003cbr>${CLIM[s.clim].ko} · ${WEATHER[s.weather].ko} · N${s.lat}° E${s.lon}°\u003cbr>\n        \u003cspan class=\"muted\">예상 광물: ${MKEYS.filter(k=>M[k].set[s.set]>=1.5).sort((a,b)=>M[b].set[s.set]-M[a].set[s.set]).map(k=>M[k].ko).slice(0,7).join(', ')}\u003c/span>\u003c/div>\n        \u003cbutton class=\"btn primary\" data-act=\"go\" data-i=\"${i}\">탐사 시작\u003c/button>\u003c/div>`).join('')}\n      \u003cdiv class=\"btnrow\" style=\"margin-top:6px\">\u003cbutton class=\"btn\" data-act=\"reroll\" style=\"flex:1\">다른 후보지 찾기\u003c/button>\u003c/div>\n      \u003cdiv class=\"seedRow\">\u003cinput id=\"seedIn\" placeholder=\"시드 번호로 탐사 (예: 12345)\" inputmode=\"numeric\">\u003cbutton class=\"btn\" data-act=\"seed\">이동\u003c/button>\u003c/div>\n      ${F.site?`\u003cp class=\"muted\" style=\"font-size:11.5px;margin-top:10px\">현재 지역 시드: \u003cspan class=\"mono\">${F.site.seed}\u003c/sp >\u003cspan>${s.site}\u003c/span>\u003ci>${won(specValue(s))}\u003c/i>\u003c/div>\u003c/button>`).join('')}\u003c/div>`\n        :`\u003cdiv class=\"empty\">${S.col.length?'조건에 맞는 표본이 없습니다.':'아직 표본이 없습니다.\u003cbr>현장에서 바위를 깨서 첫 표본을 찾아보세요.'}\u003c/div>`}\u003c/div>`;\n  }\n  else if(view==='req'){\n    genReqs();\n    sh.innerHTML=head('수집가 의뢰',tabs('req'))+`\u003cdiv class=\"sheetBody\">\u003cp class=\"muted\" style=\"margin:0 0 10px;font-size:12.5px\">조건에 맞는 표본을 납품하면 감정가보다 훨씬 비싸게 사 갑니다. 납품한 표본은 수집장에서 사라집니다.\u003c/p>\n      ${S.req.list.map((r,i)=>{const ok=S.col.filter(x=>reqMatch(r,x));return `\u003cdiv class=\"req\">\u003cdiv class=\"reqHead\">\u003cb>${reqText(r)}\u003c/b>\u003cspan class=\"mono\">감정가 ×${Math.min(r.m,1.5).toFixed(2)}\u003c/span>\u003c/div>\u003cdiv class=\"muted\" style=\"font-size:11.5px\">의뢰인: ${r.who}\u003c/div>\n        ${ok.length?`\u003cdiv class=\"reqList\">${ok.slice(0,6).map(x=>`\u003cbutton class=\"btn\" data-act=\"deliver\" data-r=\"${i}\" data-id=\"${x.id}\">${specTitle(x)} ${specNo(x)} → \u003cb class=\"mono\">${won(Math.round(specValue(x)*Math.min(r.m,1.5)/1000)*1000)}\u003c/b>\u003c/button>`).join('')}\u003c/div>`:'\u003cdiv class=\"muted\" style=\"font-size:12px;margin-top:6px\">조건에 맞는 표본이 아직 없습니다.\u003c/div>'}\u003c/div>`;}).join('')}\n      \u003cbutton class=\"btn\" data-act=\"reqnew\" style=\"margin-top:6px;width:100%\">의뢰 새로 받기 (${won(5000)})\u003c/button>\u003c/div>`;\n  }\n  else if(view==='shop'){\n    sh.innerHTML=head('장비 상점',tabs('shop'))+`\u003cdiv class=\"sheetBody\">\u003cp class=\"muted\" style=\"margin:0 0 12px\">보유 자금 \u003cb class=\"mono\" style=\"color:var(--amber2)\">${won(S.money)}\u003c/b> — 표본을 판매해 자금을 마련하세요.\u003c/p>\n      ${SHOP.map(it=>`\u003cdiv class=\"item\">\u003cdiv class=\"ic\">\u003csvg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#e0a84a\" stroke-width=\"1.7\">\u003ccircle cx=\"12\" cy=\"12\" r=\"8\"/>\u003cpath d=\"M12 8v8M8 12h8\"/>\u003c/svg>\u003c/div>\u003cdiv class=\"tx\">\u003cb>${it.n}\u003c/b>\u003cspan>${it.d}\u003c/span>\u003c/div>\n        ${S.tools[it.k]?'\u003cspan class=\"owned\">보유 중\u003c/span>':`\u003cbutton class=\"btn ${S.money>=it.p?'primary':''}\" data-act=\"buy\" data-k=\"${it.k}\" ${S.money>=it.p?'':'disabled'}>${won(it.p)}\u003c/button>`}\u003c/div>`).join('')}\u003c/div>`;\n  }\n  else if(view==='settings'){\n    const seg=(key,opts)=>`\u003cdiv class=\"seg\">${opts.map(([v,n])=>`\u003cbutton data-act=\"set\" data-k=\"${key}\" data-v=\"${v}\" class=\"${S[key]===v?'on':''}\">${n}\u003c/button>`).join('')}\u003c/div>`;\n    sh.innerHTML=head('설정',tabs('settings'))+`\u003cdiv class=\"sheetBody\">\u003cdiv class=\"kicker\">그래픽 품질\u003c/div>${seg('quality',[['low','저'],['mid','중'],['high','고']])}\n      \u003cp class=\"muted\" style=\"font-size:12px;margin:-6px 0 14px\">고: 앰비언트 오클루전·풀 13만 포기·4K 그림자 / 중: 후처리·풀 3.8만 / 저: 빠른 렌더링 (폰 발열이 심하면 추천)\u003c/p>\n      \u003cdiv class=\"kicker\">프레임 제한\u003c/div>${seg('fps',[['30','30'],['45','45'],['60','60'],['0','무제한']])}\n      \u003cdiv class=\"kicker\">절전 모드 (발열·배터리 절약)\u003c/div>\u003cdiv class=\"seg\">\u003cbutton data-act=\"eco\" data-v=\"0\" class=\"${!S.eco?'on':''}\">끔\u003c/button>\u003cbutton data-act=\"eco\" data-v=\"1\" class=\"${S.eco?'on':''}\">켬 (30fps·해상도 80%)\u003c/button>\u003c/div>\n      \u003cp class=\"muted\" style=\"font-size:12px;margin:-6px 0 14px\">기기가 버거워하면 해상도를 자동으로 낮춥니다. 지금 렌더 배율 ${Math.round(PERF.scale*100)}%\u003c/p>\n      \u003cdiv class=\"kicker\">가상 조이스틱\u003c/div>${seg('joy',[['auto','자동'],['on','항상'],['off','숨김']])}\n      \u003cdiv class=\"kicker\">감정실 조명\u003c/div>${seg('lab',[['studio','스튜디오'],['museum','박물관'],['daylight','자연광']])}\n      \u003cdiv class=\"kicker\">백업 코드\u003c/div>\u003cp class=\"muted small\">진행 상황(자금·장비·표본·손질 기록)을 코드 한 줄로 만들어 둡니다. 다른 기기나 브라우저에서 붙여넣으면 그대로 복원됩니다. 썸네일은 복원 후 다시 그려집니다.\u003c/p>\n      \u003cdiv class=\"btnrow\">\u003cbutton class=\"btn primary\" data-act=\"bkmake\" style=\"flex:1\">백업 코드 만들기\u003c/button>\u003c/div>\n      \u003cdiv id=\"bkOut\">\u003c/div>\n      \u003ctextarea id=\"bkIn\" class=\"code\" placeholder=\"여기에 백업 코드를 붙여넣으세요 (TS…로 시작)\">\u003c/textarea>\n      \u003cdiv class=\"btnrow\">\u003cbutton class=\"btn\" data-act=\"bkload\" style=\"flex:1\">이 코드로 복원\u003c/button>\u003c/div>\n      \u003cdiv class=\"kicker\" style=\"margin-top:16px\">데이터\u003c/div>\u003cbutton class=\"btn\" data-act=\"reset\" style=\"margin-top:8px\">모든 진행 초기화\u003c/button>\u003c/div>`;\n  }\n  else if(view==='mumanage'){sh.innerHTML=muManageHTML();}\n  else if(view==='multi'){if(NET.ok&&(!NET.lastFetch||Date.now()-NET.lastFetch>8000)){NET.lastFetch=Date.now();nsend({t:'museums_get'});nsend({t:'market_get'});}sh.innerHTML=head('멀티플레이',tabs('multi'))+netHTML();}\n  else if(view==='notebook'){\n    const s=F.site,st=SET[s.set],st2=SET[s.set2],list=k=>MKEYS.filter(m=>M[m].set[k]).sort((a,b)=>M[b].set[k]-M[a].set[k]).map(m=>M[m].ko).join(' · ');\n    sh.innerHTML=head('현장 수첩')+`\u003cdiv class=\"sheetBody nb\">\u003cdiv class=\"kicker\">${s.name}\u003c/div>\n      \u003ch4>${st.ko} (주 지질)\u003c/h4>\u003cp>${st.desc}\u003c/p>\u003cp class=\"muted\" style=\"font-size:12px\">산출 가능: ${list(s.set)}\u003c/p>\n      \u003ch4>${st2.ko} (일부)\u003c/h4>\u003cp>${st2.desc}\u003c/p>\u003cp class=\"muted\" style=\"font-size:12px\">산출 가능: ${list(s.set2)}\u003c/p>\n      ${s.river.on||s.clim==='arid'?`\u003ch4>하천 충적층\u003c/h4>\u003cp>${SET.placer.desc}\u003c/p>\u003cp class=\"muted\" style=\"font-size:12px\">강가의 둥근 자갈: ${list('placer')}\u003c/p>`:''}\n      \u003ch4>바위를 고르는 법\u003c/h4>\n      \u003cdiv class=\"cue\">\u003ci style=\"background:linear-gradient(135deg,#6b3216,#b8792f)\">\u003c/i>\u003cp style=\"margin:0\">붉게 녹슨 얼룩(철모자)은 황화광물이 산화된 흔적입니다.\u003c/p>\u003c/div>\n      \u003cdiv class=\"cue\">\u003ci style=\"background:repeating-linear-gradient(120deg,#666 0 6px,#eee 6px 8px)\">\u003c/i>\u003cp style=\"margin:0\">흰 석영 세맥은 열수가 지나간 길입니다.\u003c/p>\u003c/div>\n      \u003cdiv class=\"cue\">\u003ci style=\"background:radial-gradient(circle at 40% 40%,#fff,#aac 40%,#333 70%)\">\u003c/i>\u003cp style=\"margin:0\">표면에 결정이 삐죽 나온 바위는 거의 확실한 노다지입니다.\u003c/p>\u003c/div>\n      \u003cdiv class=\"cue\">\u003ci style=\"background:radial-gradient(circle,#8b7a64,#4e4236)\">\u003c/i>\u003cp style=\"margin:0\">작고 둥근 갈색 덩어리는 정동·마노·단백석일 가능성이 높습니다.\u003c/p>\u003c/div>\n      \u003cdiv class=\"cue\">\u003ci style=\"background:linear-gradient(180deg,#999 0 30%,#777 30% 60%,#aaa 60%)\">\u003c/i>\u003cp style=\"margin:0\">절벽 기슭 낙석 지대는 위쪽 지층 전체의 표본 저장소입니다. 폐광 입구 근처도 노려보세요.\u003c/p>\u003c/div>\n      \u003ch4>감정 요령\u003c/h4>\u003cul>\u003cli>\u003cb>경도\u003c/b>: 손톱 2.5 · 동전 3.5 · 쇠못 4.5 · 유리 5.5 · 강철 6.5 · 석영 7 · 황옥 8 · 강옥 9\u003c/li>\u003cli>\u003cb>조흔\u003c/b>: 겉색과 가루색은 다를 수 있습니다 — 적철석은 회색이지만 조흔은 붉습니다.\u003c/li>\n      \u003cli>\u003cb>비중\u003c/b>: 투명한데 무겁다면 납 광물(백연석 6.5, 모연석 6.8)을, 금속인데 엄청 무겁다면 금(19.3)을 의심하세요.\u003c/li>\u003cli>\u003cb>형광\u003c/b>: 회중석·규아연석은 단파에서, 형석은 장파에서 강하게 빛납니다.\u003c/li>\u003c/ul>\u003c/div>`;\n  }\n}\ndocument.addEventListener('click',e=>{\n  const b=e.target.closest('[data-act]');if(!b)return;audioInit();SFX.click();const a=b.dataset.act;\n  if(netAct(a,b))return;\n  if(a==='xsend'){xSendToGB(LB.spec);return;}\n  if(a==='exhibit'){const s=LB.spec;if(s&&S.col.includes(s)){muSync();if(S.museum.includes(s.id)){S.museum=S.museum.filter(x=>x!==s.id);toast('박물관에서 내렸어요.');}else{S.museum.push(s.id);toast('박물관에 전시했어요.');}save();netPubMuseum();renderLabUI();}return;}\n  if(a==='mklist'){const s=LB.spec;if(s&&S.col.includes(s)){NET.listSpec=s.id;closeLab();openOverlay('multi');}return;}\n  if(a==='close')closeOverlay();\n  else if(['map','collection','shop','notebook','req','settings','multi'].includes(a)){if((a==='notebook')&&!F.ready)return;openOverlay(a);}\n  else if(a==='museum'){enterMuseum();}\n  else if(a==='mutab'){S.muTab=b.dataset.v;save();renderOverlay('mumanage');}\n  else if(a==='mutoggle'){muSync();const id=+b.dataset.id;if(S.museum.includes(id))S.museum=S.museum.filter(x=>x!==id);else S.museum.push(id);save();netPubMuseum();renderOverlay('mumanage');if(mode==='museum')muRefresh();}\n  else if(a==='muall'){S.museum=S.col.map(x=>x.id);save();netPubMuseum();renderOverlay('mumanage');if(mode==='museum')muRefresh();}\n  else if(a==='munone'){S.museum=[];save();netPubMuseum();renderOverlay('mumanage');if(mode==='museum')muRefresh();}\n  else if(a==='muauto'){S.muAuto=S.muAuto!==true;save();renderOverlay('mumanage');}\n  else if(a==='mufocus'){muSync();const i=S.museum.indexOf(+b.dataset.id);if(i>=0&&mode==='museum'){closeOverlay();muFocus(i);}}\n  else if(a==='colopt'){S[b.dataset.k]=b.dataset.v;save();renderOverlay('collection');}\n  else if(a==='deliver'){const r=S.req.list[+b.dataset.r],sp=S.col.find(x=>x.id==b.dataset.id);if(r&&sp&&reqMatch(r,sp)){const pay=Math.round(specValue(sp)*Math.min(r.m,1.5)/1000)*1000;S.money+=pay;S.col=S.col.filter(x=>x!==sp);S.req.list.splice(+b.dataset.r,1);genReqs();save();SFX.coin();toast(`${r.who}에게 납품! ${won(pay)}을 받았습니다.`);updateHUD();renderOverlay('req');}}\n  else if(a==='reqnew'){if(S.money\u003c5000){toast('자금이 부족합니다.');return;}S.money-=5000;S.req.list=[];genReqs();save();updateHUD();renderOverlay('req');}\n  else if(a==='reroll'){siteChoices=null;renderOverlay('map');}\n  else if(a==='go')startSite(siteChoices[+b.dataset.i]);\n  else if(a==='seed'){const v=parseInt($('#seedIn').value,10);if(v>0)startSite(genSite(v));}\n  else if(a==='buy'){const it=SHOP.find(x=>x.k===b.dataset.k);if(S.money>=it.p&&!S.tools[it.k]){S.money-=it.p;S.tools[it.k]=true;save();SFX.coin();toast(`${it.n} 구입!`+(it.k==='map'&&F.ready?' 다음 탐사부터 표식이 보입니다.':''));updateHUD();renderOverlay('shop');}}\n  else if(a==='lab'){const s=S.col.find(x=>x.id==b.dataset.id);if(s)openLab(s);}\n  else if(a==='eco'){S.eco=b.dataset.v==='1';save();applyPR();renderOverlay('settings');}\n  else if(a==='set'){const k=b.dataset.k,v=b.dataset.v,prev=S[k];S[k]=v;save();\n    if(k==='quality'&&prev!==v){PERF.scale=1;PERF.low=0;PERF.base=basePR(PERF.hi);renderer.setPixelRatio(curPR());onResize();if(LC){LC.c.dispose();LC=null;}if(F.site){closeOverlay();startSite(F.site);return;}}\n    if(k==='joy')applyJoyPref();if(k==='lab')applyLight();renderOverlay('settings');}\n  else if(a==='bkmake'){makeBackup().then(code=>{$('#bkOut').innerHTML=`\u003ctextarea class=\"code\" id=\"bkCode\" readonly>${code}\u003c/textarea>\u003cdiv class=\"btnrow\">\u003cbutton class=\"btn\" data-act=\"bkcopy\" style=\"flex:1\">복사하기\u003c/button>\u003c/div>\u003cp class=\"muted small\">${code.length.toLocaleString()}자 · 표본 ${S.col.length}개 · ${new Date().toLocaleString('ko-KR')}\u003c/p>`;}).catch(()=>toast('백업 코드를 만들지 못했습니다.'));}\n  else if(a==='bkcopy'){const t=$('#bkCode');t.focus();t.select();t.setSelectionRange(0,t.value.length);\n    (navigator.clipboard?navigator.clipboard.writeText(t.value):Promise.reject()).then(()=>toast('백업 코드를 복사했습니다. 메모장 등에 보관하세요.')).catch(()=>{try{document.execCommand('copy');toast('복사했습니다.');}catch(e){toast('코드를 길게 눌러 직접 복사해 주세요.');}});}\n  else if(a==='bkload'){const v=$('#bkIn').value;if(!v.trim()){toast('백업 코드를 먼저 붙여넣으세요.');return;}\n    if(b.dataset.arm!=='1'){readBackup(v).then(d=>{b.dataset.arm='1';b.dataset.ok='1';b.textContent=`표본 ${d.col.length}개, 자금 ${won(d.money)} — 현재 진행을 덮어씁니다. 한 번 더 탭`;b.classList.add('primary');}).catch(()=>toast('올바른 백업 코드가 아닙니다.'));return;}\n    readBackup(v).then(d=>{try{localStorage.setItem(SAVE_KEY,JSON.stringify(Object.assign(JSON.parse(JSON.stringify(DEF)),d)));}catch(e){}toast('복원했습니다. 다시 불러오는 중…');setTimeout(()=>location.reload(),600);}).catch(()=>toast('올바른 백업 코드가 아닙니다.'));}\n  else if(a==='reset'){if(b.dataset.arm!=='1'){b.dataset.arm='1';b.textContent='정말 초기화할까요? 한 번 더 탭';return;}try{localStorage.removeItem(SAVE_KEY);localStorage.removeItem('takseok_v1');}catch(e){}location.reload();}\n});\nfunction startSite(site){\n  closeOverlay();$('#loading').style.opacity=1;$('#loading').classList.remove('hidden');$('#loadMsg').textContent='지층을 쌓고 광맥을 숨기는 중…';\n  setTimeout(async()=>{buildField(site);S.site=site;save();netLeave();netJoin(site.seed);updateHUD();\n    // 셰이더를 백그라운드로 미리 준비 (처음 접속 시 브라우저가 멈춘 것처럼 보이는 현상 방지)\n    if(!startSite._warm&&renderer.compileAsync){$('#loadMsg').textContent='그래픽 준비 중… (처음 한 번만 조금 걸려요)';F.paused=true;\n      const wg=warmGroup();noTrans(wg);F.scene.add(wg);\n      try{await Promise.race([renderer.compileAsync(F.scene,F.cam),new Promise(r=>setTimeout(r,30000))]);}catch(e){}F.scene.remove(wg);setTimeout(()=>{for(const m of wg.userData.mats)m.dispose();wg.userData.geo.dispose();},5000);F.paused=false;startSite._warm=true;warmLater();}\n    // 로딩 화면이 떠 있는 동안 한 프레임을 미리 그려 그림자·첫 사용 셰이더 연결 대기를 끝내 둠 (입장 직후 멈춤 방지)\n    try{mode='field';renderer.shadowMap.needsUpdate=true;renderField();}catch(e){}\n    $('#hud').classList.remove('hidden');mode='field';setControls();applyJoyPref();\n    $('#loading').style.opacity=0;setTimeout(()=>$('#loading').classList.add('hidden'),500);\n    const h=$('#hint');h.innerHTML=S.hintSeen?`${SET[site.set].ko} — 유망한 바위를 찾아보세요.`:(coarse?'조이스틱이나 탭으로 이동, 망치 버튼이나 바위 탭으로 채굴합니다.':'WASD·클릭으로 이동, Space나 바위 클릭으로 채굴합니다.')+'\u003cbr>녹슨 얼룩·흰 석영맥·드러난 결정이 있는 바위를 노리세요.';h.style.opacity=1;\n    clearTimeout(startSite._t);startSite._t=setTimeout(()=>h.style.opacity=0,S.hintSeen?3500:9000);S.hintSeen=true;save();},60);\n}\nfunction setControls(){fControls.enabled=mode==='field';lControls.enabled=mode==='lab';mControls.enabled=mode==='museum';}\n\n/* ---------- prep (손질) ---------- */\nfunction partName(s,p){const m=M[p];return (p===s.k&&s.identified)?m.ko:(s.identified&&p!==s.k&&false)?m.ko:`${m.v[0].cd} ${m.lu} 결정`;}\nfunction trimHTML(){return `\u003cdiv class=\"trimBox\">${TR.fixed?'':`\u003clabel class=\"rng\">방향\u003cinput type=\"range\" min=\"0\" max=\"359\" value=\"${TR.a}\" data-tr=\"a\">\u003cspan>${TR.a}°\u003c/span>\u003c/label>\u003clabel class=\"rng\">기울기\u003cinput type=\"range\" min=\"-70\" max=\"70\" value=\"${TR.t}\" data-tr=\"t\">\u003cspan>${TR.t}°\u003c/span>\u003c/label>`}\n  \u003clabel class=\"rng\">깊이\u003cinput type=\"range\" min=\"0\" max=\"70\" value=\"${Math.round(TR.depth*100)}\" data-tr=\"depth\">\u003cspan>${Math.round(TR.depth*100)}%\u003c/span>\u003c/label>\n  \u003cdiv class=\"trimRow\">\u003cdiv id=\"trimInfo\">\u003c/div>\u003cbutton class=\"btn primary\" data-prep=\"cut\">자르기\u003c/button>\u003cbutton class=\"btn\" data-prep=\"tcancel\">취소\u003c/button>\u003c/div>\u003c/div>`;}\nfunction prepHTML(){\n  if(TR.on)return trimHTML();\n  const s=LB.spec,obj=LB.obj,parts=obj.userData.parts,mins=parts.filter(p=>p!=='matrix'),hasMx=parts.includes('matrix'),d=Math.round((s.dirt||0)*100);\n  const ob=(a,n,sub,dis)=>`\u003cbutton class=\"tbtn ${dis?'lock':''}\" data-prep=\"${a}\">\u003cb>${n}\u003c/b>\u003cspan>${sub}\u003c/span>\u003c/button>`;\n  let h=`\u003cdiv class=\"kicker\">세척\u003c/div>\u003cdiv class=\"meter\">\u003ci style=\"width:${d}%\">\u003c/i>\u003c/div>\u003cp class=\"muted small\">오염도 ${d}% — 흙과 녹물이 낄수록 감정가가 내려갑니다 (최대 -35%).\u003c/p>\n    \u003cdiv class=\"tests\">${ob('water','물 세척','솔과 물. 안전하지만 일부만 지워짐')}${ob('oxalic','옥살산 세척',S.tools.oxalic?'녹물까지 제거. 탄산염 주의!':'상점에서 구입 필요',!S.tools.oxalic)}${ob('ultra','초음파 세척',S.tools.ultra?'완벽 세척. 섬세한 결정 주의!':'상점에서 구입 필요',!S.tools.ultra)}\u003c/div>`;\n  if(s.gem){h+=`\u003cdiv class=\"kicker\" style=\"margin-top:16px\">보석 세공\u003c/div>`+gemHTML();}\n  else if(s.ext==='gb'){h+=`\u003cp class=\"muted small\" style=\"margin-top:12px\">금빛 여울에서 온 표본은 모양을 지키기 위해 조각·분리는 할 수 없지만, \u003cb>보석 세공\u003c/b>은 할 수 있어요. 원석 모양은 금빛 여울에서의 모습 그대로예요.\u003c/p>\u003cdiv class=\"kicker\" style=\"margin-top:12px\">보석 세공\u003c/div>`+gemHTML();}\n  else{\n  h+=`\u003cdiv class=\"kicker\" style=\"margin-top:16px\">트리밍\u003c/div>`;\n  if(!TR.on){h+=`\u003cp class=\"muted small\">모암을 손으로 조각하듯 깎아 모양을 다듬습니다. 결정 주변은 자동으로 보호되지만, \u003cb style=\"color:#f0a27c\">결정을 직접 치면 가치가 내려갑니다\u003c/b>.\u003c/p>\n      \u003cdiv class=\"tests\">${ob('sculpt','조각 모드','드래그로 깎기 · 끌/망치/줄')}${ob('flat','바 {v:4,t:Date.now(),d});\n  if(window.CompressionStream){const buf=await new Response(new Blob([json]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer();return 'TSZ1.'+b64e(new Uint8Array(buf));}\n  return 'TSJ1.'+b64e(new TextEncoder().encode(json));\n}\nasync function readBackup(code){\n  code=code.trim().replace(/\\s+/g,'');const tag=code.slice(0,5),u=b64d(code.slice(5));let json;\n  if(tag==='TSZ1.')json=await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();\n  else if(tag==='TSJ1.')json=new TextDecoder().decode(u);else throw new Error('tag');\n  const o=JSON.parse(json),d=o.d;if(!d||!Array.isArray(d.col)||typeof d.money!=='number')throw new Error('bad');\n  d.col=d.col.filter(x=>x&&M[x.k]&&typeof x.seed==='number');return d;\n}\n/* lazy thumbnail rebuild (after restore) */\nsetInterval(()=>{if(mode==='lab'||TH.busy||TH.q.length)return;const s=S.col.find(x=>!x.thumb&&!x.thumbFail);if(s)makeThumb(s);},700);\nTH.onDone=()=>{if(!$('#overlay').classList.contains('hidden')&&$('#sheet .grid')&&!TH.q.length)renderOverlay('collection');};\n\n/* ---------- requests ---------- */\nconst GORD='SABCD';\nfunction newReq(){S.req.n=(S.req.n||0)+1;const g=new RNG(hashStr('req'+S.req.n+':'+S.nextId+':'+S.col.length));\n  const t=g.weighted([['k',4],['fl',1.2],['size',1.2],['twin',.8],['set',1.2],['clean',1],['heavy',.7]])[0];\n  const who=g.pick(['대학 자연사 박물관','개인 수집가 김 선생','광물 동호회 회장','보석 디자이너','국립 과학관','해외 경매상','지질 연구소','초등학교 과학 교실','형광 광물 마니아']);\n  if(t==='k'){const k=g.pick(MKEYS.filter(k=>M[k].val\u003c500));return {t,k,g:g.pick(['C','B','B','A']),m:g.range(0.99,1.43),who};}\n  if(t==='fl')return {t,m:g.range(0.88,1.21),who:'형광 광물 마니아'};\n  if(t==='size')return {t,min:g.pick([10,12,14]),m:g.range(0.77,1.04),who};\n  if(t==='twin')return {t,m:g.range(0.99,1.32),who};\n  if(t==='set'){const st=g.pick(Object.keys(SET));return {t,set:st,m:g.range(0.77,0.99),who};}\n  if(t==='clean')return {t,m:g.range(0.83,1.  Å (단위포만 표시)',columbite:'(Fe,Mn)(Nb,Ta)₂O₆ · Pbcn · a = 14.27, b = 5.73, c = 5.09 Å (단위포만 표시)',cerussite:'PbCO₃ · Pmcn · a = 5.15, b = 8.47, c = 6.11 Å (단위포만 표시)',vanadinite:'Pb₅(VO₄)₃Cl · P6₃/m · a = 10.33, c = 7.35 Å (단위포만 표시)',wulfenite:'PbMoO₄ · I4₁/a · a = 5.43, c = 12.10 Å (단위포만 표시)'};\nconst BOOK=[\n {id:'gold',n:'자연금 (사금)',c:'#ffd23f',f:'Au',sg:'19.3',h:'2.5–3',rep:'nugget',t:'산의 금맥이 풍화되며 떨어져 나와 강을 타고 내려온 것이 사금입니다. 물보다 19배 무거워 물살이 느려지는 곳에 가라앉습니다.'},\n {id:'magnetite',n:'자철석',c:'#2a2a30',f:'Fe₃O₄',sg:'5.2',h:'5.5–6.5',rep:'magnetite',t:'자석에 붙는 검은 광물. 사금 채취자들이 \"검은 모래\"라 부르며, 검은 모래가 모이는 곳에 금도 함께 모이는 경우가 많습니다.'},\n {id:'garnet',n:'석류석',c:'#b3203a',f:'Fe₃Al₂(SiO₄)₃ 등',sg:'3.6–4.3',h:'6.5–7.5',rep:'garnetX',t:'변성암에 흔한 붉은 광물. 무거워서 접시에 붉은 모래로 남고, 큰 결정은 12면체 모양을 띱니다.'},\n {id:'zircon',n:'지르콘',c:'#e0a35c',f:'ZrSiO₄',sg:'4.6–4.7',h:'7.5',rep:'zircon',t:'풍화에 매우 강해 수십억 년을 버티는 광물. 지질학자들이 암석의 나이를 잴 때 씁니다.'},\n {id:'pyrite',n:'황철석',c:'#cdb94e',f:'FeS₂',sg:'4.9–5.2',h:'6–6.5',rep:'pyriteCube',t:'\"바보의 금\". 금처럼 노랗지만 단단하고 잘 부서지며, 각진 정육면체 결정을 만듭니다. 금보다 훨씬 가볍습니다.'},\n {id:'corundum',n:'강옥 (사파이어)',c:'#2b63e0',f:'Al₂O₃',sg:'4.0',h:'9',rep:'sapphire',t:'다이아몬드 다음으로 단단한 광물. 파란 것은 사파이어, 붉은 것은 루비입니다. 단단하고 무거워 강모래 속에 남습니다.'},\n {id:'quartz',n:'석영',c:'#e8f0f2',f:'SiO₂',sg:'2.65',h:'7',rep:'quartz',t:'강모래의 대부분. 패닝 때 씻겨 나가는 가벼운 모래가 바로 석영입니다. 암석 틈에서는 육각기둥 결정으로 자랍니다.'},\n {id:'amethyst',n:'자수정',c:'#8a4fc4',f:'SiO₂ (철 미량)',sg:'2.65',h:'7',rep:'amethyst',t:'미량의 철과 자연 방사선 때문에 보랏빛을 띠는 석영. 암석 속 빈 공간에서 결정으로 자랍니다.'},\n {id:'ilmenite',n:'티탄철석 (일메나이트)',c:'#1c1c20',f:'FeTiO₃',sg:'4.7',h:'5–6',rep:'ilmenite',t:'티타늄의 주요 원료. 자성이 약해 강한 자석에만 살짝 끌립니다. 검은 모래 속에서 자철석과 섞여 나옵니다.'},\n {id:'monazite',n:'모나자이트',c:'#c88a3c',f:'(Ce,La,Nd,Th)PO₄',sg:'4.6–5.4',h:'5–5.5',rep:'monazite',t:'희토류 원소를 담은 인산염 광물. 토륨이 조금 들어 있어 약한 방사능을 띱니다. 사금 광상의 무거운 모래에 흔히 섞여 나옵니다.'},\n {id:'rutile',n:'금홍석',c:'#8e2c12',f:'TiO₂',sg:'4.2–4.3',h:'6–6.5',rep:'rutile',t:'적갈색 기둥 결정에 세로 줄무늬가 있고 금강광택이 납니다. 석영 속에 바늘처럼 들어가면 \"금홍석 수정\"이 됩니다.'},\n {id:'cassiterite',n:'석석',c:'#4a2e1a',f:'SnO₂',sg:'6.8–7.1',h:'6–7',rep:'cassiterite',t:'주석의 거의 유일한 원료. 매우 무거워 사금과 함께 패닝 접시에 남습니다. 꺾인 \"무릎 쌍정\"으로도 유명합니다.'},\n {id:'scheelite',n:'회중석',c:'#ead9ae',f:'CaWO₄',sg:'5.9–6.1',h:'4.5–5',rep:'scheelite',t:'텅스텐 원료. 단파 자외선을 비추면 푸르스름한 흰빛 형광을 냅니다. 강원도 상동 광산은 한때 세계적인 텅스텐 산지였습니다.'},\n {id:'osmiridium',n:'오스뮴이리듐',c:'#9ea0a4',f:'(Os,Ir)',sg:'19–21',h:'6–7',rep:'osmiridium',t:'가장 무겁고 단단한 자연 금속 합금 가운데 하나. 사금 광상에서 아주 드물게 은회색 육각 판 알갱이로 나옵니다. 예전엔 만년필 펜촉 끝에 붙였습니다.'},\n {id:'staurolite',n:'십자석',c:'#6e4224',f:'Fe₂Al₉Si₄O₂₃(OH)',sg:'3.7–3.8',h:'7–7.5',rep:'staurolite',t:'두 결정이 직각이나 60°로 엇갈려 자란 십자 모양 쌍정으로 유명합니다. 편암 같은 변성암에서 나옵니다.'},\n {id:'kyanite',n:'남정석',c:'#3a64b8',f:'Al₂SiO₅',sg:'3.5–3.7',h:'4.5–5 / 6.5–7',rep:'kyanite',t:'방향에 따라 굳기가 크게 달라 길이 방향으로는 칼에 긁히지만 가로로는 안 긁힙니다. 높은 압력에서 생긴 변성암의 지표 광물입니다.'},\n {id:'fluorite',n:'형석',c:'#7b4fb0',f:'CaF₂',sg:'3.18',h:'4',rep:'fluorite',t:'형광(fluorescence)이라는 말이 이 광물에서 나왔어요. 장파 자외선에 푸른 보랏빛으로 빛나는 것이 많고, 칼에 긁힙니다.'},\n {id:'calcite',n:'방해석',c:'#efe2c2',f:'CaCO₃',sg:'2.71',h:'3',rep:'calcite',t:'묽은 염산을 떨어뜨리면 거품을 내며 녹아요. 투명한 결정 너머 글자가 두 겹으로 보이고(복굴절), 붉은 형광을 내는 것이 많습니다.'},\n {id:'willemite',n:'윌레마이트',c:'#bcd6b0',f:'Zn₂SiO₄',sg:'3.9–4.2',h:'5.5',rep:'willemite',t:'단파 자외선을 비추면 눈부신 초록빛을 내는 아연 광물. 낮에는 평범한 연녹색 돌처럼 보여요.'},\n {id:'hematite',n:'적철석',c:'#3a2e30',f:'Fe₂O₃',sg:'5.0–5.3',h:'5.5–6.5',rep:'hematite',t:'겉은 검고 반짝여도 조흔판에 그으면 붉은 갈색 가루가 나와요. 철의 가장 중요한 원료이고 자석에는 거의 붙지 않습니다.'},\n {id:'galena',n:'방연석',c:'#6d6e74',f:'PbS',sg:'7.4–7.6',h:'2.5',rep:'galena',t:'납의 원료. 손에 들면 놀랄 만큼 무겁고, 세 방향으로 직각으로 쪼개져 작은 정육면체 조각이 됩니다.'},\n {id:'sphalerite',n:'섬아연석',c:'#5a3414',f:'ZnS',sg:'3.9–4.1',h:'3.5–4',rep:'sphalerite',t:'아연의 원료. 검게 보여도 조흔색은 옅은 노란 갈색이라 감별에 쓰여요. 주황빛 형광을 내는 것도 있습니다.'},\n {id:'cinnabar',n:'진사',c:'#b5180f',f:'HgS',sg:'8.0–8.2',h:'2–2.5',rep:'cinnabar',t:'수은의 원료로, 옛날엔 붉은 안료(주사)로 썼어요. 조흔색이 선명한 주홍색이고 매우 무겁습니다. 독성이 있어 맨손으로 오래 만지지 않아요.'},\n {id:'copper',n:'자연동',c:'#c56a3e',f:'Cu',sg:'8.9',h:'2.5–3',rep:'copper',t:'순수한 구리가 그대로 굳은 것. 겉은 검붉게 녹슬어 있지만 칼로 긁으면 구릿빛이 드러나고 휘어집니다.'},\n {id:'malachite',n:'공작석',c:'#2f9a5e',f:'Cu₂CO₃(OH)₂',sg:'3.6–4.0',h:'3.5–4',rep:'malachite',t:'구리 광상 윗부분에 생기는 초록 광물. 자르면 짙고 옅은 초록 띠가 보이고, 묽은 산에 거품을 냅니다.'},\n {id:'pyrrhotite',n:'자류철석',c:'#9a7a4a',f:'Fe₁₋ₓS',sg:'4.6',h:'3.5–4.5',rep:'pyrrhotite',t:'청동빛 금속 광물로 자석에 약하게 붙어요. 자철석과 달리 칼에 긁히고 조흔색이 회흑색입니다.'},\n {id:'barite',n:'중정석',c:'#e6dcc2',f:'BaSO₄',sg:'4.3–4.6',h:'3–3.5',rep:'barite',t:'흰 돌처럼 생겼는데 들어 보면 이상하게 무거워요(이름이 무거운 돌). 시추용 이수와 엑스선 조영제에 씁니다.'},\n {id:'tourmaline',n:'전기석',c:'#d0548a',f:'복잡한 붕규산염',sg:'3.0–3.3',h:'7–7.5',rep:'tourmaline',t:'단면이 둥근 삼각형인 기둥에 세로 줄무늬가 있어요. 데우거나 문지르면 전기를 띠어 재를 끌어당겨요(초전기성). 속은 분홍, 겉은 초록인 수박 전기석도 있어요.'},\n {id:'beryl',n:'녹주석',c:'#8fd3e0',f:'Be₃Al₂Si₆O₁₈',sg:'2.63–2.92',h:'7.5–8',rep:'beryl',t:'베릴륨 원료. 파란 것은 아쿠아마린, 초록은 에메랄드예요. 페그마타이트의 빈 공간에서 깔끔한 육각기둥으로 자랍니다.'},\n {id:'topaz',n:'토파즈',c:'#9cc8e8',f:'Al₂SiO₄(F,OH)₂',sg:'3.49–3.57',h:'8',rep:'topaz',t:'모스 경도 8의 기준 광물. 바닥면 방향으로 깔끔하게 쪼개지고, 페그마타이트 공동에서 큰 결정으로 나와요.'},\n {id:'amazonite',n:'아마조나이트',c:'#3fbfae',f:'KAlSi₃O₈',sg:'2.56',h:'6–6.5',rep:'amazonite',t:'청록색 미사장석. 흰 줄무늬(퍼사이트)가 비치고, 화강암 페그마타이트에서 큼직한 덩어리로 나와요. 색은 미량의 납 때문이에요.'},\n {id:'muscovite',n:'백운모',c:'#cbbd9e',f:'KAl₂(AlSi₃O₁₀)(OH)₂',sg:'2.76–2.88',h:'2–2.5',rep:'muscovite',t:'종잇장처럼 얇게 벗겨지는 운모. 투명한 큰 판은 예전에 난로 창으로 썼어요(러시아 유리). 가벼워서 패닝하면 금방 쓸려가요.'},\n {id:'lepidolite',n:'홍운모',c:'#a67fc6',f:'K(Li,Al)₃(Al,Si)₄O₁₀(F,OH)₂',sg:'2.8–2.9',h:'2.5–3',rep:'lepidolite',t:'리튬을 담은 보랏빛 운모. 작은 비늘 조각들이 반짝이며 뭉쳐 있어요. 리튬 페그마타이트의 표시 광물이에요.'},\n {id:'selenite',n:'투명석고',c:'#eef0ea',f:'CaSO₄·2H₂O',sg:'2.3',h:'2',rep:'selenite',t:'손톱으로도 긁히는 무른 광물. 투명하고 길쭉한 판으로 자라며, 멕시코 나이카 동굴에선 10 m가 넘는 결정이 나왔어요.'},\n {id:'aragonite',n:'아라고나이트',c:'#efe8d6',f:'CaCO₃',sg:'2.95',h:'3.5–4',rep:'aragonite',t:'방해석과 성분은 같지만 결정 구조가 다른 동질이상 광물. 동굴에서 바늘 다발로 자라고, 산에 거품을 내며, 형광을 내는 것도 많아요.'},\n {id:'azurite',n:'남동석',c:'#1a3caa',f:'Cu₃(CO₃)₂(OH)₂',sg:'3.77–3.89',h:'3.5–4',rep:'azurite',t:'짙은 파란 구리 광물. 공작석과 함께 나오고, 세월이 지나면 공작석으로 바뀌기도 해요. 옛날엔 파란 물감의 원료였어요. 산에 녹아요.'},\n {id:'painite',n:'페이나이트 ★',c:'#9a3420',f:'CaZrAl₉O₁₅(BO₃)',sg:'4.0',h:'8',rep:'painite',t:'1950년대 미얀마에서 처음 발견된 뒤 수십 년 동안 세상에 결정이 몇 개뿐이었던 \"세계에서 가장 희귀한 광물\"로 유명해요. 미얀마 모곡의 보석 자갈에서 나와요.'},\n {id:'taaffeite',n:'타페이트 ★',c:'#c890c8',f:'BeMg₃Al₈O₁₆',sg:'3.6',h:'8–8.5',rep:'taaffeite',t:'이미 깎여 있던 보석을 감정하다가 \"첨정석인 줄 알았는데 복굴절이 있다!\"는 걸 알아채 발견된, 원석보다 나석으로 먼저 발견된 유일한 광물이에요. 스리랑카 보석 자갈에서 나와요.'},\n {id:'benitoite',n:'벤이토아이트 ★',c:'#3050d8',f:'BaTiSi₃O₉',sg:'3.65',h:'6–6.5',rep:'benitoite',t:'캘리포니아 샌베니토 카운티의 사문암 속 맥에서만 보석급이 나와요. 사파이어처럼 파랗지만 분산이 다이아몬드만큼 커서 무지갯빛 불꽃이 튀고, 단파 자외선에 눈부신 파란 형광을 내요.'},\n {id:'alexandrite',n:'알렉산드라이트 ★',c:'#2f8a5a',f:'BeAl₂O₄ (Cr)',sg:'3.73',h:'8.5',rep:'alexandrite',t:'\"낮엔 에메랄드, 밤엔 루비.\" 크롬 때문에 햇빛 아래선 초록, 백열등 아래선 붉은 보라로 색이 바뀌어요. 운모편암 속 페그마타이트 근처에서 나요. 계곡(햇빛)과 작업실(전등)에서 색을 비교해 보세요.'},\n {id:'crocoite',n:'크로코아이트 ★',c:'#ff5a10',f:'PbCrO₄',sg:'5.9–6.1',h:'2.5–3',rep:'crocoite',t:'납 광상의 산화대에서 드물게 자라는 새빨간 주황 바늘 결정. 크롬 원소가 처음 발견된 광물이에요(1797). 아주 무르고 부서지기 쉬워요.'},\n {id:'spinel',n:'스피넬',c:'#d02848',f:'MgAl₂O₄',sg:'3.6',h:'8',rep:'spinel',t:'오랫동안 루비로 오해받던 보석. 영국 왕관의 \"흑태자의 루비\"도 사실은 스피넬이에요. 보석 자갈에서 사파이어·루비와 함께 나와요.'},\n {id:'platinum',n:'자연 백금',c:'#d8d8dc',f:'Pt (Fe·Ir 함유)',sg:'14–19',h:'4–4.5',rep:'platinum',t:'사금 접시 바닥에 남는 회백색의 무거운 알갱이. 금과 함께 강모래에서 나오며, 일부는 자성을 띠기도 해요.'},\n {id:'arsenopyrite',n:'비소황철석',c:'#c8c4b8',f:'FeAsS',sg:'6.1',h:'5.5–6',rep:'arsenopyrite',t:'은백색 금속광물. 깨면 마늘 냄새(비소)가 나요. 석영 맥에서 금과 함께 나오는 경우가 많아 금 탐사의 단서가 돼요.'},\n {id:'chalcopyrite',n:'황동석',c:'#d8b040',f:'CuFeS₂',sg:'4.2',h:'3.5–4',rep:'chalcopyrite',t:'가장 중요한 구리 광석. 황철석보다 노랗고 무르며, 표면이 산화되면 공작 깃털 같은 무지갯빛으로 변해요.'},\n {id:'epidote',n:'녹렴석',c:'#6a7a20',f:'Ca₂(Al,Fe)₃Si₃O₁₂(OH)',sg:'3.45',h:'6–7',rep:'epidote',t:'변성암에 흔한 녹색 광물. 피스타치오색이 특징이고 보는 방향에 따라 녹색·갈색으로 달라 보여요(다색성).'},\n {id:'spodumene',n:'스포듀민 (쿤자이트)',c:'#f0a0c8',f:'LiAlSi₂O₆',sg:'3.18',h:'6.5–7',rep:'spodumene',t:'리튬 페그마타이트의 거대 결정. 분홍색은 쿤자이트, 녹색은 히데나이트라 불러요. 햇빛에 오래 두면 색이 바래요.'},\n {id:'apatite',n:'인회석',c:'#40a0b0',f:'Ca₅( Math.max(0,L.t1-now)}}\nconst mmss=ms=>{const t=Math.ceil(ms/1000);return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')};\nfunction aucLotsHTML(){const A=S.auc||[];if(!A.length)return'\u003cp style=\"color:var(--mut)\">진행 중인 경매가 없어요.\u003c/p>';return A.map(L=>{const st=aucState(L),s=L.spec;return`\u003cdiv class=\"row\">${sw(IT[s.k].c)}\u003cdiv class=\"nm\">${s.cut?'세공한 ':''}${IT[s.k].n} #${s.id}${varOf(s)?' · '+varOf(s).n.split(' (')[0]:''}\u003csmall>감정가 ${fmt(L.base)} · 입찰 ${st.nb}회${L.war&&st.p>.4?' · \u003cb style=\"color:#ff9a5a\">입찰 전쟁!\u003c/b>':''} · 남은 시간 ${mmss(st.left)}\u003c/small>\u003cdiv class=\"mtr\" style=\"margin-top:4px\">\u003cspan>진행\u003c/span>\u003ci>\u003cb style=\"width:${Math.round(st.p*100)}%;background:linear-gradient(90deg,#c9a24a,#ffe28a)\">\u003c/b>\u003c/i>\u003cem>${Math.round(st.p*100)}%\u003c/em>\u003c/div>\u003c/div>\u003cdiv class=\"num\" style=\"color:var(--gold)\">${st.nb?fmt(st.bid):'입찰 대기'}\u003c/div>\u003c/div>`}).join('')}\nfunction openAuction(){const A=S.auc||[],L=S.specs.filter(aucOK).sort((a,b)=>b.v-a.v).slice(0,40);\n openModal(`\u003ch2>경매장\u003c/h2>\u003cp>감정가 ${fmt(AUC_MIN)} 이상인 표본만 출품할 수 있어요. 수집가들이 경쟁해서 감정가보다 비싸게 팔리는 경우가 많지만, 끝날 때까지 몇 분이 걸려요. 낙찰가에서 수수료 ${Math.round(AUC_FEE*100)}%를 떼요. 희귀 광물·희귀 변종·거대 결정·잘 깎은 보석일수록 경쟁이 붙어요.\u003c/p>\n \u003ch3>진행 중 (${A.length}/${AUC_MAX})\u003c/h3>\u003cdiv id=\"aucLots\">${aucLotsHTML()}\u003c/div>\u003ch3>출품할 수 있는 표본\u003c/h3>${L.length?L.map(s=>`\u003cdiv class=\"row\">${sw(IT[s.k].c)}\u003cdiv class=\"nm\">${s.cut?'세공한 ':''}${IT[s.k].n} #${s.id}\u003csmall>${fmtL(s.mm)} · ${fmtW(s.g)}${varOf(s)?' · '+varOf(s).n:''}${IT[s.k].rare?' · ★ 초희귀':''}\u003c/small>\u003c/div>\u003cdiv class=\"num\">${fmt(s.v)}\u003c/div>\u003cbutton class=\"btn\" data-auc=\"${s.id}\" ${A.length>=AUC_MAX?'disabled':''}>출품\u003c/button>\u003c/div>`).join(''):'\u003cp style=\"color:var(--mut)\">아직 출품할 만큼 비싼 표본이 없어요. 희귀한 결정을 손질하고 세공하면 값이 크게 올라요.\u003c/p>'}`,true,false,true)}\nfunction aucConsign(id){S.auc=S.auc||[];if(S.auc.length>=AUC_MAX)return;const s=S.specs.find(x=>x.id==id);if(!s||!aucOK(s))return;S.specs=S.specs.filter(x=>x!==s);\n const now=Date.now(),dur=clamp(90+(Math.log10(s.v)-3.4)*80+Math.random()*40,90,300)*1000,war=Math.random()\u003c.12;let fin=Math.round(s.v*(1.15+Math.pow(Math.random(),1.4)*1.15)*aucBonus(s)*(1+(upv('price')-1)*.5)*trendMul(s.k));if(war)fin=Math.round(fin*(1.6+Math.random()*.9));\n S.auc.push({spec:s,t0:now,t1:now+dur,base:s.v,fin,war,nb:(war?20:8)+Math.floor(Math.random()*14)});save();hud();sfx.coin();toast(`${IT[s.k].n} 출품 완료 · 약 ${Math.round(dur/60000*10)/10}분 뒤 낙찰돼요`,'g');openAuction()}\nlet aucLast=0;\nfunction aucTick(){const A=S.auc||[];if(!A.length)return;const now=Date.now();let ch=false;for(const L of A.slice()){if(now>=L.t1){const pay=Math.round(L.fin*(1-AUC_FEE));S.money+=pay;S.auc=S.auc.filter(x=>x!==L);ch=true;toast(`${L.war?'🔥 입찰 전쟁 끝에 ':''}경매 낙찰! ${IT[L.spec.k].n} → ${fmt(L.fin)} (수수료 뺀 ${fmt(pay)} · 감정가의 ${(L.fin/L.base).toFixed(2)}배)`,'g');try{sfx.gold()}catch(e){}}}\n if(ch){save();hud()}const el=document.getElementById('aucLots');if(el&&modalOn)el.innerHTML=aucLotsHTML();if(ch&&el&&modalOn)openAuction()}\n// ---------- 온라인 (채팅 · 플레이어 경매장 · 랭킹 · 전시장 구경) ----------\nconst MP_ON=!!document.querySelector('meta[name=\"geumbit-mp\"]');\nconst MP={ws:null,ok:false,online:0,chat:[],rank:[],players:[],auc:[],tab:'auc',retry:0,visitReq:null};\nconst esc=t=>String(t).replace(/[&\u003c>\"']/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nfunction mpSend(o){if(MP.ws&&MP.ok)try{MP.ws.send(JSON.stringify(o))}catch(e){}}\nfunction mpProfile(){const all=S.specs,tot=all.reduce((a,b)=>a+b.v,0)+Object.values(S.mpL||{}).reduce((a,b)=>a+(b.spec.v||0),0),best=all.reduce((a,b)=>b.v>(a?a.v:0)?b:a,null);\n return{total:Math.round(tot),best:best?Math.round(best.v):0,bestN:best?((best.cut?'세공 ':'')+IT[best.k].n):'',found:Object.keys(S.found||{}).length,money:Math.round(S.money),disp:S.disp.length}}\nfunction mpDisp(){return S.disp.map(id=>S.specs.find(x=>x.id===id)).filter(Boolean).slice(0,40)}\nlet mpProfT=0;function mpPush(){if(!MP.ok)return;clearTimeout(mpProfT);mpProfT=setTimeout(()=>mpSend({t:'profile',profile:mpProfile(),disp:mpDisp()}),1500)}\nfunction mpConnect(){if(!MP_ON||!S.mpName)return;if(!S.mpId){S.mpId=Math.random().toString(36).slice(2)+Date.now().toString(36);save()}\n let L=location;try{if(L.protocol==='about:'&&parent!==window)L=parent.location}catch(e){}const ws=new WebSocket((L.protocol==='https:'?'wss://':'ws://')+L.host+'/ws-gb');MP.ws=ws;\n ws.onopen=()=>{MP.ok=true;MP.retry=0;S.mpL=S.mpL||{};S.mpB=S.mpB||{};ws.send(JSON.stringify({t:'hello',id:S.mpId,name:S.mpName,profile:mpProfile(),disp:mpDisp(),listings:Object.entries(S.mpL).map(([lid,L])=>({lid,spec:L.spec,start:L.start,end:L.end})),bids:Object.entries(S.mpB).map(([lid,amt])=>({lid,amt}))}));chatRender()};\n ws.onclose=()=>{MP.ok=false;chatRender();setTimeout(mpConnect,Math.min(30000,2000*(++MP.retry)))};\n ws.onerror=()=>{};\n ws.onmessage=ev=>{let m;try{m=JSON.parse(ev.data)}catch(e){return}mpOn(m)}}\nfunction mpGive(spec){const s=Object.assign({},spec);delete s.nm;S.nid=(S.nid||0)+1;s.id=S.nid;if(s.ext==='ts'){try{xReg(s)}catch(e){}}S.specs.push(s);const b=IT[s.k]&&IT[s.k].b;if(b&&!S.found[b])S.found[b]=1;return s}\nfunction mpOn(m){\n if(m.t==='welcome'){MP.chat=m.chat||[];MP.rank=m.rank||[];MP.auc=m.auc||[];MP.players=m.players||[];MP.online=m.online||0;chatRender();mpRefresh()}\n else if(m.t==='chat'){MP.chat.push(m);if(MP.chat.length>60)MP.chat.shift();chatRender(true)}\n else if(m.t==='online'){MP.online=m.n;chatRender()}\n else if(m.t==='rank'){MP.rank=m.rank;MP.players=m.players||MP.players;mpRefresh()}\n else if(m.t==='auc'){MP.auc=m.auc;mpRefresh()}\n else if(m.t==='disp'){if(MP.visitReq===m.pid){MP.visitReq=null;openVisit(m.name,m.specs||[])}}\n else if(m.t==='listed'){toast(`플레이어 경매에 올렸어요 · ${fmt(m.start)}부터`,'g')}\n else if(m.t==='bidok'){S.mpB=S.mpB||{};const prev=S.mpB function openGame(id){if(!frames[id]&&!EMB(id)&&location.protocol.startsWith('http')&&!openGame.chk&&!openGame['ok'+id]){openGame.chk=1;fetch(SRC[id],{method:'HEAD',cache:'no-store'}).then(r=>{openGame.chk=0;if(r.ok){openGame['ok'+id]=1;openGame(id)}else{window.__PLAT_NOTE='';$('inbox').innerHTML=`<span style="color:#ff9a7a;border-color:#ff9a7a66">서버에 <b>${SRC[id]}</b> 파일이 없어요 — GitHub 저장소에 올렸는지 확인해 주세요</span>`}}).catch(()=>{openGame.chk=0;openGame['ok'+id]=1;openGame(id)});return}
 _open(id)}
function _open(id){for(const k in frames)if(k!==id){frames[k].style.display='none';post(k,'freeze')}
 if(!frames[id]){const f=document.createElement('iframe');f.className='game';f.setAttribute('allow','autoplay; fullscreen; clipboard-write; pointer-lock');if(EMB(id)){try{f.srcdoc=JSON.parse(EMB(id).textContent)}catch(e){f.src=SRC[id]}}else f.src=SRC[id];document.body.appendChild(f);frames[id]=f}
 frames[id].style.display='block';post(id,'thaw');cur=id;$('home').style.display='none';$('homeBtn').style.display='block';try{frames[id].focus()}catch(e){}status()}
function home(){for(const k in frames){frames[k].style.display='none';post(k,'freeze')}cur=null;$('home').style.display='flex';$('homeBtn').style.display='none';status()}
document.querySelectorAll('[data-game]').forEach(b=>b.addEventListener('click',()=>openGame(b.dataset.game)));
$('homeBtn').addEventListener('click',home);
setInterval(()=>{if(!cur)status()},2000);status();
})();
</script>
</body></html>
